name: build-android-apk-master

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      # 签出代码 (固定拉取 master 分支,当前master已合并dev最新内容,比dev更新)
      - uses: actions/checkout@v4
        with:
          ref: master

      # 安装 Java (Android 编译需要)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 安装 Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      # 获取依赖
      - name: Install dependencies
        working-directory: simple_live_app
        run: flutter pub get

      # 生成临时签名密钥 (仓库里不含正式签名文件,自动补一个让构建能跑通)
      - name: Generate temporary keystore
        working-directory: simple_live_app/android
        run: |
          keytool -genkey -v -keystore app/keystore.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass simplelive123 -keypass simplelive123 \
            -dname "CN=SimpleLive, OU=Dev, O=Dev, L=City, S=State, C=US"
          cat > key.properties << EOF
          storePassword=simplelive123
          keyPassword=simplelive123
          keyAlias=simplelive
          storeFile=keystore.jks
          EOF

      # 编译 Android APK (unsigned/debug 签名,直接可装)
      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release

      # 上传产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
